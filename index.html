<!DOCTYPE html>
<html>
<head>
  <title>Enneagram Guide</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Avenir, Arial, sans-serif;
      background: #f7f5f2;
      margin: 0;
      padding: 0;
      color: #2f2f2f;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-weight: 500;
      margin-bottom: 20px;
      font-size: 30px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    #chat {
      margin-bottom: 20px;
      min-height: 200px;
      padding-top: 10px;
    }

    .message {
      margin-bottom: 12px;
      line-height: 1.6;
      font-size: 16px;
      max-width: 80%;
      display: block;
    }

    .user {
      margin-left: auto;
      background: #f1efec;
      padding: 10px 14px;
      border-radius: 12px;
      text-align: right;
    }

    .ai {
      background: #f7f5f2;
      padding: 10px 14px;
      border-radius: 12px;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      outline: none;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      background: #2f2f2f;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
    }

    button:hover {
      opacity: 0.85;
    }

    @media (min-width: 768px) {
      .container {
        padding: 40px;
      }

      h2 {
        font-size: 34px;
      }

      .message {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- YOUR IMAGE -->
  <img src="labyrinth.jpg" alt="labyrinth path" style="width:100%; height:260px; object-fit:cover; border-radius:12px; margin-bottom:20px;">

  <h2>Explore your Enneagram Type</h2>

  <p>
    Have you ever wondered why you see the world the way you do?<br>
    Or why the same patterns keep showing up in your life?<br>
    The Enneagram offers a way to understand why.<br><br>
    Curious? Start a conversation below.
  </p>

  <div id="chat"></div>

  <input id="input" placeholder="What led you here?" />
  <button onclick="sendMessage()">Continue</button>

</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const userMessage = input.value;

  if (!userMessage) return;

  chat.innerHTML += '<div class="message user">' + userMessage + '</div>';

  fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: userMessage })
  })
  .then(response => response.json())
  .then(data => {
    chat.innerHTML += '<div class="message ai">' + data.reply + '</div>';
    chat.scrollTop = chat.scrollHeight;
  })
  .catch(error => {
    console.error("Error:", error);
  });

  input.value = "";
}
</script>

</body>
</html>
