<!DOCTYPE html>
<html>
<head>
  <title>Enneagram Guide</title>
 <style>
  body {
    font-family: Georgia, serif;
    background: #f7f5f2;
    margin: 0;
    padding: 0;
    color: #2f2f2f;
  }

  .container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
  }

  h2 {
    font-weight: normal;
    margin-bottom: 20px;
    font-size: 22px;
  }

  #chat {
    margin-bottom: 20px;
    min-height: 300px;
  }

  .message {
    margin-bottom: 15px;
    line-height: 1.6;
    font-size: 16px;
  }

  .user {
    text-align: right;
    color: #555;
  }

  .ai {
    text-align: left;
    color: #2f2f2f;
  }

  input {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    border: none;
    border-bottom: 1px solid #ccc;
    background: transparent;
    outline: none;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    margin-top: 12px;
    padding: 16px;
    background: #2f2f2f;
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.85;
  }

  @media (min-width: 768px) {
    .container {
      padding: 40px;
    }

    h2 {
      font-size: 26px;
    }

    .message {
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h2>A quiet place to explore your patterns</h2>

  <div id="chat"></div>

  <input id="input" placeholder="Start wherever feels true..." />
  <button onclick="sendMessage()">Continue</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const userMessage = input.value;

  if (!userMessage) return;

  console.log("Sending:", userMessage);

  chat.innerHTML += '<div class="message user">' + userMessage + '</div>';

  fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: userMessage })
  })
  .then(response => response.json())
  .then(data => {
    chat.innerHTML += '<div class="message ai">' + data.reply + '</div>';
    chat.scrollTop = chat.scrollHeight;
  })
  .catch(error => {
    console.error("Error:", error);
  });

  input.value = "";
}
</script>

</body>
</html>
