<!DOCTYPE html>
<html>
<head>
  <title>Enneagram Guide</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #f7f5f2;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
      color: #2f2f2f;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h2 {
      font-weight: normal;
      margin-bottom: 20px;
    }

    #chat {
      margin-bottom: 20px;
    }

    .message {
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .user {
      text-align: right;
      color: #555;
    }

    .ai {
      text-align: left;
      color: #2f2f2f;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      font-size: 16px;
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #2f2f2f;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>A quiet place to explore your patterns</h2>

  <div id="chat"></div>

  <input id="input" placeholder="Start wherever feels true..." />
  <button onclick="sendMessage()">Continue</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const userMessage = input.value;
  if (!userMessage) return;

  chat.innerHTML += `<div class="message user">${userMessage}</div>`;

  const response = await fetch("api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: userMessage })
  });

  const data = await response.json();

  chat.innerHTML += `<div class="message ai">${data.reply}</div>`;

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
