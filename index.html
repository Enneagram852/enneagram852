<!DOCTYPE html>
<html>
<head>
  <title>Enneagram Guide</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Avenir, Arial, sans-serif;
      color: #2f2f2f;

      background: url('https://github.com/Enneagram852/enneagram852/blob/main/labyrinth.png') no-repeat center center fixed;
      background-size: cover;
    }

    /* soft fade overlay */
    .overlay {
      background: rgba(255, 255, 255, 0.75);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 20px;
    }

    p {
      line-height: 1.6;
      margin-bottom: 20px;
    }

    #chat {
      margin-bottom: 20px;
      min-height: 150px;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
    }

    .user {
      background: #f1efec;
      margin-left: auto;
      text-align: right;
    }

    .ai {
      background: #f7f5f2;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 14px;
      border: none;
      border-bottom: 1px solid #ccc;
      background: transparent;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #2f2f2f;
      color: white;
      border: none;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

<div class="overlay">
  <div class="container">

    <h2>Explore your Enneagram Type</h2>

    <p>
      Have you ever wondered why you see the world the way you do?<br>
      Or why the same patterns keep showing up in your life?<br>
      The Enneagram offers a way to understand why.<br><br>
      Curious? Start a conversation below.
    </p>

    <div id="chat"></div>

    <input id="input" placeholder="What led you here?" />
    <button onclick="sendMessage()">Continue</button>

  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");

  const userMessage = input.value;

  if (!userMessage) return;

  chat.innerHTML += '<div class="message user">' + userMessage + '</div>';

  fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ message: userMessage })
  })
  .then(response => response.json())
  .then(data => {
    chat.innerHTML += '<div class="message ai">' + data.reply + '</div>';
    chat.scrollTop = chat.scrollHeight;
  })
  .catch(error => {
    console.error("Error:", error);
  });

  input.value = "";
}
</script>

</body>
</html>
